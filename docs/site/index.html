<!doctype html>
<!-- 밝기: OS 웹 화면 기본값과 같은 soft (노란 상단바). 시스템 다크 설정을 따르지 않는다 -->
<html lang="ko" data-theme="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPibo 가이드</title>
<link rel="stylesheet" href="_nav/kit/pibo-ui.css">
<style>
  body.pb-v2 { margin: 0; min-height: 100vh; word-break: keep-all; overflow-wrap: anywhere; }
  body.pb-v2 .pb-header {
    background: var(--v2-frame); color: var(--v2-frame-ink);
    border-bottom: 1px solid var(--v2-frame-line);
  }
  .brand-mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 6px;
    background: var(--v2-frame-ink); color: var(--v2-frame); font-size: 12px; font-weight: 800;
  }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -.3px; }
  h1::after {
    content: ""; display: block; width: 36px; height: 4px; margin-top: 10px;
    border-radius: 2px; background: var(--v2-yellow);
  }
  .lead { color: var(--v2-ink-2); margin: 14px 0 28px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--v2-surface); border: 1px solid var(--v2-line);
    border-radius: 12px; padding: 18px 18px 8px;
  }
  .card h2 { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
  .card ul { list-style: none; margin: 0; padding: 0; }
  .card li + li { border-top: 1px solid var(--v2-line); }
  .card li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 0; }
  .card li a.ver {
    flex: 1 1 180px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    min-height: 44px; padding: 0 6px; color: var(--v2-ink); text-decoration: none; border-radius: 8px;
  }
  .card li a.ver:hover { background: var(--v2-hover); }
  .card li a:focus-visible { outline: 2px solid var(--v2-accent); outline-offset: 2px; }
  .links { display: inline-flex; gap: 6px; }
  .links .pb-btn { text-decoration: none; }
  .tag { font: 700 15px/1 var(--pb-mono); }
  .badges { margin-left: auto; display: inline-flex; gap: 6px; }
  .pb-badge.released { background: var(--v2-accent-t); color: var(--v2-accent-ink); }
  .pb-badge.testing { background: var(--v2-yellow-t); color: var(--v2-ink); }
  .pb-badge.latest { background: var(--v2-accent); color: var(--v2-on-dark); }
  .help { margin-top: 28px; }
  body.pb-v2 .help.pb-note--warn { background: var(--v2-yellow-t); border-left-color: var(--v2-yellow-2); color: var(--v2-ink); }
  .help h3 { font-size: 15px; margin: 0 0 6px; }
  .help p { margin: 0; color: var(--v2-ink); line-height: 1.6; }
</style>
</head>
<body class="pb pb-v2">
<header class="pb-header">
  <span class="pb-header__brand"><span class="brand-mark" aria-hidden="true">P</span> OpenPibo 가이드</span>
</header>
<main>
  <h1>버전별 문서와 예제</h1>
  <p class="lead">내 기기의 OS 버전과 같은 버전의 문서와 예제를 쓰세요. 버전마다 쓸 수 있는 기능과 블록이 다릅니다.</p>
  <div class="grid">
<!--DEVICES-->
  </div>
  <section class="help pb-note pb-note--warn">
    <h3>테스트 중인 버전</h3>
    <p>아직 공식 배포 전인 버전입니다. 내용이 바뀔 수 있으니 수업에는 <strong>배포</strong> 표시가 있는 버전을 쓰세요.</p>
  </section>
</main>
</body>
</html>
