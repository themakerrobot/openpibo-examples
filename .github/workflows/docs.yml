# 기기·버전별 문서 사이트를 GitHub Pages 로 배포한다.
# 버전 목록은 docs/versions.json. 문서는 각 openpibo-os.<기기> 태그의 docs/build/html 을 그대로 쓴다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 배포된다.
#
# '테스트 중' 버전은 OS 저장소의 마지막 태그(YYMMDDvN, 접미사 태그 제외)다.
# 예약 실행(매일 21:00 KST)은 마지막 태그가 바뀌었을 때만 배포한다.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - tools/docs/**
      - .github/workflows/docs.yml
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC = 21:00 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.latest.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: latest
        run: >-
          python3 tools/docs/latest_tag.py
          --compare "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/_nav/latest.json"
          >> "$GITHUB_OUTPUT"

  build:
    needs: check
    # 예약 실행은 마지막 태그가 바뀌었을 때만, 푸시·수동 실행은 항상
    if: github.event_name != 'schedule' || needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/docs/build_site.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
